; FaxSend settings for ONE customer.
; Copy to customers\<customername>\config.ini, fill in the [server] section,
; then run: make_package.bat <customername>

[server]
; Base URL of the customer's FusionPBX, no trailing slash
url = PUT_URL_HERE
; api = FusionPBX REST API, web = web fax page login
method = api
; API key of the customer's FusionPBX fax user (Accounts > User Manager > Edit > API Key)
; The user needs fax_view, fax_queue_add and fax_queue_view
api_key = PUT_API_KEY_HERE
; UUID of the customer's fax server (id= in the URL when editing it in Fax Server)
fax_uuid = PUT_FAX_UUID_HERE
; FusionPBX server hostname (run "hostname" on the server)
hostname = 
verify_ssl = true
; Leave blank: read from the fax server automatically
domain_uuid =
domain_name =

[folders]
; Leave blank: <Documents>\FaxSend\Outbox, Sent, Failed, Logs of the PC user who installs it
watch =
sent =
failed =
logs =

[fax]
; Leave caller ID blank to use the fax server's caller ID
caller_id_name =
caller_id_number =
; Usually blank: FusionPBX applies the fax server's own prefix
dial_prefix =
; Email address for fax result notifications (optional)
email =
; Fax quality: normal, fine or superfine
resolution = fine
; tif = convert PDFs to fax TIFF on the PC (required: FreeSWITCH only sends TIFF)
send_format = tif
; web method only
header =
sender =
page_size = letter
cover_subject =
cover_message =

[options]
poll_seconds = 5
settle_seconds = 3
retries = 2
